server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ${APP_NAME}
    cache:
      ttl:
        users: 10m
        products: 2h
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration
